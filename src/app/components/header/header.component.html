<p-menubar #menubar [model]="$menuItems()" aria-label="Menu">
    
    <ng-template #start>
        @if (logoBlockFromMenu(); as logo) {
            <a routerLink="/" class="logo-link" aria-label="Go to home">
                <img [src]="logo.media?.[0]?.url" [alt]="logo.altText ?? ''" class="logo"/>
            </a>
        }
    </ng-template>

    <ng-template #end>

        <div class="actions-menu">
            <div>
                <p-select [options]="langOptions()" [ngModel]="selectedCode()" 
                          optionLabel="name" optionValue="code"
                          class="w-full md:w-56" (ngModelChange)="onLangChange($event)" />
            </div>
            <div>
                <p-button type="button" [text]="true" [rounded]="true" ariaLabel="Toggle theme" class="theme-mode"
                          [icon]="(isDark$ | async) ? 'pi pi-moon' : 'pi pi-sun'" (onClick)="toggleTheme()"/>
            </div>
        </div>
    </ng-template>
</p-menubar>
