<div class="conditions">
  @for (item of content(); track $index) {
    @switch (item.tagHtml) {
      @case ('h2') { <h2 class="conditions-h2">{{ item.text }}</h2> }
      @case ('h4') { <h4 class="conditions-h4">{{ item.text }}</h4> }
      @case ('p')  { <p class="conditions-p">{{ item.text }}</p> }
      @case ('ul') { <ul class="conditions-list"><li>{{ item.text }}</li></ul> }
      @case ('a')  { <a class="conditions-link" href="#">{{ item.text }}</a> }
    }
  }
</div>
