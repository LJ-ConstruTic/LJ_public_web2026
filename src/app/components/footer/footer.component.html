<div class="footer">
  <div class="footer-main">

    <div class="footer-brand">
      <!-- @if (footer().logo) {
      <img class="footer-logo" [src]="footer().logo" alt="LJConstruTic" />
      } -->
      <p class="footer-company">{{ footerCompany()?.content }}</p>
      <!-- <p class="footer-copyright">{{ footer().copyright }} {{ currentYear }}</p> -->
    </div>

    <div class="footer-social">
      <!-- @for (social of footerSocial()?.properties; track social.url) { -->
      <a [href]="footerSocial()?.properties?.['href']" target="_blank" class="footer-social-link">
        <!-- <img [src]="social.icon" [alt]="social.alt" /> -->
      </a>
      <!-- } -->
    </div>

    <div class="footer-contact">
      <a class="footer-contact-item" [href]="'tel:' + footerContact()?.properties?.['phone']">
        <i class="pi pi-phone"></i>
        <span>{{ footerContact()?.properties?.['phone'] }}</span>
      </a>
      <a class="footer-contact-item" [href]="'mailto:' + footerContact()?.properties?.['email']">
        <i class="pi pi-envelope"></i>
        <span>{{ footerContact()?.properties?.['email'] }}</span>
      </a>
      <!-- <span class="footer-contact-item">
        <i class="pi pi-map-marker"></i>
        <span>{{ footer().address }}</span>
      </span> -->
    </div>

  </div>

  <div class="footer-divider"></div>

  <div class="footer-legal">
    <!-- <a routerLink="/privacy">{{ footer().legal.privacy }}</a>
    <a routerLink="/data-protection">{{ footer().legal.dataProtection }}</a>
    <a routerLink="/cookies">{{ footer().legal.cookies }}</a>
    <a routerLink="/conditions">{{ footer().legal.conditions }}</a> -->
  </div>
</div>
