<div class="about">
  <div class="image-container">
    @if (aboutImageUrl()) {
      <img class="image-style" [src]="aboutImageUrl()" [alt]="block().content ?? ''" />
    }
  </div>

  <div class="about-content">
    <p [innerHTML]="block().content | bold"></p>
    <button class="btn-byn" (click)="goToAboutDetail()">
      Saiba mais
    </button>
  </div>
</div>
