<div class="about">
  <div class="image-container">
    @if (aboutImageUrl(); as url) {
      <picture>
        @if (url | cmsImageSrcset; as srcset) {
          <source type="image/webp" [srcset]="srcset" sizes="(max-width: 767px) 92vw, 40vw">
        }
        <img class="image-style" [src]="url" [alt]="block().content ?? ''" loading="lazy" decoding="async" />
      </picture>
    }
  </div>

  <div class="about-content">
    <p [innerHTML]="block().content | bold"></p>
    <button class="btn-byn" (click)="goToAboutDetail()">
      {{ buttonMoreText() }}
    </button>
  </div>
</div>
