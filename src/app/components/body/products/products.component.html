<div class="products">
    <h2 class="products-title">{{ productsTitle() }}</h2>

    @if (productTextBlocks().length > 0) {
        <p class="products-subtitle">{{ productTextBlocks()[0].content }}</p>
    }

    <div class="products-grid">
        @for (product of productCards(); track product.id) {
            <div class="products-card" (click)="navigateToProduct(product)">
                @if (product.media.length > 0) {
                    <div class="products-card-img">
                        <img [src]="product.media[0].url" [alt]="product.content ?? ''" />
                    </div>
                }
                <h3 class="products-card-title">{{ product.content }}</h3>
            </div>
        }
    </div>

    @if (productTextBlocks().length > 1) {
        <p class="products-subtitle">{{ productTextBlocks()[1].content }}</p>
    }
</div>
