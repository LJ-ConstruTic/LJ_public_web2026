<div class="join">
  <h2 class="join-title">{{ data().title }}</h2>
  <p class="join-subtitle">{{ data().subtitle }}</p>
  <p class="join-positions">{{ data().positions }}</p>

  @if (data().offers.length > 0) {
    <div class="join-offers">
      @for (offer of data().offers; track offer.title) {
        <div class="join-offer">
          <i class="pi pi-briefcase join-offer-icon"></i>
          <div>
            <h3 class="join-offer-title">{{ offer.title }}</h3>
            <p class="join-offer-desc">{{ offer.desc }}</p>
          </div>
        </div>
      }
    </div>
  }

  <p class="join-cta">{{ data().cta }}</p>
</div>
