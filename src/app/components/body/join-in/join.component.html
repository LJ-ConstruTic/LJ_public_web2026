<div class="join">
    <h2 class="join-title">{{ sectionTitle() }}</h2>
    @if (offers().length > 0) {
        <div class="join-grid">
            @for (offer of offers(); track offer.title) {
                <div class="join-card">
                    <div class="join-card-icon">
                        <i class="pi pi-briefcase"></i>
                    </div>
                    <h3 class="join-card-title">{{ offer.title }}</h3>
                    <p class="join-card-desc">{{ offer.description }}</p>
                    <button class="btn-blue join-card-btn">Saiba mais</button>
                </div>
            }
        </div>
    }
</div>
