<section class="team-section" aria-labelledby="team-title">
  <header class="team-intro" lang="pt">
    <h2 id="team-title">Nossa equipe</h2>
    <p>Somos uma equipe internacional que reúne profissionais de diferentes áreas, da construção à informática.</p>
  </header>
  <div class="team-grid">
    @for (member of members(); track member.id) {
        <div class="team__member">
            <div class="team__member-img">
                @if (member.image) {
                    <img [src]="member.image" [alt]="member.name" />
                } @else {
                    <div class="team__member-placeholder">
                        {{ member.name.charAt(0) }}
                    </div>
                }
            </div>
            <span class="team__member-name">{{ member.name }}</span>
        </div>
    }
  </div>
</section>
