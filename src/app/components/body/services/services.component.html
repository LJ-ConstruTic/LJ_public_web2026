<div class="services">
    <h2 class="services-title">{{ servicesTitle() }}</h2>

    <div class="services-grid">
        @for (item of serviceCardsWithDescription(); track item.card.id) {
            <button type="button" class="services-card" (click)="navigateToService(item.card)">
                <span class="services-card-img">
                    @if (item.card.media.length > 0) {
                        <img [src]="item.card.media[0].url" alt="" loading="lazy" decoding="async" />
                    }
                </span>
                <span class="services-card-content">
                    <span class="services-card-title">{{ item.card.content }}</span>
                    <span class="services-card-desc">{{ item.description }}</span>
                </span>
            </button>
        }
    </div>
</div>
