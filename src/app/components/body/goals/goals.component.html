<div class="goals">
  <h2 class="goals-title">{{ goals().sectionTitle }}</h2>
  <p class="goals-intro-text">{{ goals().intro }}</p>

  <div class="goals-grid">
    @for (step of goals().steps; track step.num; let i = $index) {
      <div class="goals-card" [ngStyle]="{ 'background-color': colors[i], '--card-color': colors[i], 'color': textColor(colors[i]) }">
        <span class="goals-num">{{ step.num }}. {{ step.title }}</span>
        <p class="goals-desc">{{ step.desc }}</p>
        <i class="goals-icon pi" [ngClass]="icons[i]"></i>
        @if (i < goals().steps.length - 1) {
          <div class="goals-triangle"></div>
        }
      </div>
    }
  </div>
</div>
