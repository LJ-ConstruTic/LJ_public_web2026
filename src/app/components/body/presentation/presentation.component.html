<section class="slider-wrapper">
  @if (carouselSlides().length > 0) {
    <p-carousel
      [value]="carouselSlides()"
      [numVisible]="1"
      [numScroll]="1"
      [circular]="carouselSlides().length > 1"
      [autoplayInterval]="autoplayInterval()"
      [showNavigators]="false"
      [showIndicators]="true"
      styleClass="presentation-carousel">

      <ng-template #item let-slide>
        <div class="slide" [attr.lang]="slide.language ?? null">
          @if (slide.imageUrl; as url) {
            <picture>
              @if (slide.srcset || responsiveSources(url); as srcset) {
                <source type="image/webp"
                        [srcset]="srcset"
                        sizes="100vw" />
              }
              <img [src]="url" [alt]="slide.imageAlt" class="slide-img"
                   [attr.fetchpriority]="slide === carouselSlides()[0] ? 'high' : null"
                   [loading]="slide === carouselSlides()[0] ? 'eager' : 'lazy'" />
            </picture>
          }
          <div class="slide-overlay">
            <p class="slide-title">{{ slide.content }}</p>
          </div>
        </div>
      </ng-template>

    </p-carousel>
  }
</section>
