<section class="strategy">
    <div class="image-container">
        @if (strategyImage()) {
            <img class="image-style" [src]="strategyImage()" alt="Strategy" />
        }
    </div>
    <div class="strategy-content">
        <h2>{{ strategyTitle() }}</h2>
        @for (text of strategyTexts(); track text.id) {
            <p>{{ text.content }}</p>
        }
    </div>
</section>
