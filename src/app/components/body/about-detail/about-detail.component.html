<div class="component-container">

    @for (section of historySections(); track $index) {
        <section class="about-section"
                 [class.about-section--reversed]="$index % 2 !== 0">
            @if (section.image) {
                <div class="about-section__image">
                    <img [src]="section.image" [alt]="section.title" />
                </div>
            }
            <div class="about-section__content">
                <h2>{{ section.title }}</h2>
                @for (paragraph of section.paragraphs; track $index) {
                    <p [innerHTML]="paragraph | bold"></p>
                }
            </div>
        </section>
    }

    @if (teamBlocks().length > 0) {
        <team [blocks]="teamBlocks()" />
    }

    @if (joinBlocks().length > 0) {
        <join [blocks]="joinBlocks()" />
    }

    <section class="back-section">
        <button class="btn-back" (click)="goBack()"><i class="pi pi-arrow-left"></i> {{ returnButtonText() }}</button>
    </section>

</div>
