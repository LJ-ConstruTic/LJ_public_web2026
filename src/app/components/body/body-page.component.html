@for (component of $activeComponents(); track component.id; ) { <!-- let isPar = $even even: Si el índice de fila actual es par-->
    <!--<section [id]="component.name" > [class.section--gray]="!isPar" [class.section--white]="isPar" -->
    <section [id]="getDictionaryKey(component.name)">
        {{ getDictionaryKey(component.name) }}
        @if(component.name === "Home") {
            <presentation/>
        } @else {
            <div class="component-container">
                <!-- <ng-container *ngComponentOutlet="getComponent(component.idx)" /> -->
                <ng-container *ngComponentOutlet="getComponent(component.name)"/>
            </div>
        }
    </section>
}
